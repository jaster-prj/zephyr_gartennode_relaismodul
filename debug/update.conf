# Optional hardware update diagnostics. Keep SWD disconnected during transfers;
# inspect the retained counters and RTT output only after a test has finished.
CONFIG_RELAY_UPDATE_DIAGNOSTICS=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_UART_CONSOLE=n
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=8192
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y
