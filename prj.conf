# Print a banner on the UART on startup.
CONFIG_BOOT_BANNER=y

CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_MULTITHREADING=y
#CONFIG_WATCHDOG=y
#CONFIG_TASK_WDT=y
#CONFIG_TASK_WDT_MIN_TIMEOUT=500
CONFIG_CANOPENNODE_LOG_LEVEL_DBG=y

CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_GPIO_PCF857X=y
CONFIG_SENSOR=y

CONFIG_CAN=y

CONFIG_MAIN_STACK_SIZE=2048

CONFIG_CANOPENNODE=y
CONFIG_CANOPENNODE_SYNC_THREAD=y
CONFIG_CANOPENNODE_STORAGE=y
CONFIG_CANOPENNODE_LEDS=y
CONFIG_CANOPENNODE_PROGRAM_DOWNLOAD=y
CONFIG_CANOPEN_NODE_ID=11

CONFIG_LOG_PRINTK=y
CONFIG_REBOOT=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
# Enable Zephyr application to be booted by MCUboot
CONFIG_BOOTLOADER_MCUBOOT=y

# PROGRAM_CTRL_CLEAR erases the complete secondary slot before download.
# Do not erase sectors again while handling SDO data.
CONFIG_IMG_ERASE_PROGRESSIVELY=n
CONFIG_STREAM_FLASH_ERASE=n

# Use the default MCUBoot PEM key file (BOOT_SIGNATURE_KEY_FILE)
CONFIG_MCUBOOT_SIGNATURE_KEY_FILE="bootloader/mcuboot/gartennode.pem"
