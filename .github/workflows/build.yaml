name: CI
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/jaster-prj/devcontainer-zephyr-workspace:latest
      volumes:
        - /opt/hostedtoolcache:/delete-me
    outputs:
      artifact-url: ${{ steps.artifact-upload.outputs.artifact-url }}
      artifact-id: ${{ steps.artifact-upload.outputs.artifact-id }}
    steps:
      - name: Clean Out Deletable Files
        run: rm -rf /delete-me/*
        shell: bash
      - name: link workspace
        run: |
          ln -s /workspace ./zephyr_workspace
      - name: Download zephyr
        working-directory: ./zephyr_workspace
        run: |
          west update
          /opt/venv/bin/python -m pip install -r zephyr/scripts/requirements.txt
          west zephyr-export
      - name: Clone Application
        uses: actions/checkout@v7
        with:
          path: './zephyr_workspace/application'
          submodules: recursive
      - name: save gartennode.pem
        working-directory: ./zephyr_workspace/bootloader/mcuboot
        run: |
          echo "$PEM" | base64 --decode > gartennode.pem
        shell: bash
        env:
          PEM: ${{ secrets.ZEPHYR_SIGN_KEY }}
      - name: Build Bootloader
        working-directory: ./zephyr_workspace
        run: |
          /opt/venv/bin/west build -b gartennode bootloader/mcuboot/boot/zephyr --build-dir build/bootloader -- -DEXTRA_CONF_FILE="$(pwd)/application/bootloader.conf"
      - name: Build Application
        working-directory: ./zephyr_workspace
        run: |
          /opt/venv/bin/west build -b gartennode application --build-dir build/application -- -DEXTRA_CONF_FILE=prj.conf
      - name: Create Software-Container
        working-directory: ./zephyr_workspace
        run: |
          cp build/bootloader/zephyr/zephyr.bin bootloader.bin
          cp build/application/zephyr/zephyr.bin application.bin
          cp build/application/zephyr/zephyr.signed.bin application.signed.bin
          # Use Zephyr's configured header size and MCUboot swap mode.
          /opt/venv/bin/python application/scripts/check_firmware.py application.signed.bin build/application/zephyr/.config
          /opt/venv/bin/python -m unittest discover -s application/scripts -p 'test_*.py'
          /opt/venv/bin/python bootloader/mcuboot/scripts/imgtool.py verify --key bootloader/mcuboot/gartennode.pem application.signed.bin
          /opt/venv/bin/python application/scripts/prepare_eds.py build/application/zephyr/.config application/objdict/objdict.eds objdict.eds
          tar -czf software.tar.gz bootloader.bin application.bin application.signed.bin objdict.eds
      - name: Publish binary
        id: artifact-upload
        uses: actions/upload-artifact@v6
        with:
          name: softwarefile
          path: zephyr_workspace/software.tar.gz
  trigger:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Flash
        run: |
          # Set the required variables
          repo_owner="jaster-prj" 
          repo_name="gartennode_updater"  
          event_type="trigger-workflow" 
          artifact_url=${{ needs.build.outputs.artifact-url }}
          artifact_id=${{ needs.build.outputs.artifact-id }}
          node_id=${{ vars.NODEID }}
          run_id=${{ github.run_id }}

          echo $artifact_id

          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.PAT }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/$repo_owner/$repo_name/dispatches \
            -d "{\"event_type\": \"$event_type\", \"client_payload\": {\"repo_name\":\"jaster-prj/zephyr_gartennode_relaismodul\",\"run_id\":\"$run_id\",\"node_id\":\"$node_id\",\"artifact_id\":\"$artifact_id\",\"artifact_url\": \"$artifact_url\"}}"
